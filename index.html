<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Coop</title>
  <meta name="description" content="Game Coop: original games for Mac.">
  <meta name="theme-color" content="#0f0e0b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23ffc629'/><circle cx='20' cy='13' r='7' fill='%230f0e0b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wire" aria-hidden="true"></div>
  <div class="wire wire-lit" aria-hidden="true"></div>

  <header class="hero">
    <h1 class="wordmark" aria-label="Game Coop">
      <span aria-hidden="true">GAME</span>
      <svg class="mascot" viewBox="0 0 112 130" aria-hidden="true">
        <defs>
          <clipPath id="lens-clip">
            <path d="M82 27 H97 C98 33 96 38 90 38 C85 38 82 34 82 27Z"/>
          </clipPath>
        </defs>
        <g class="chick" fill="currentColor">
          <!-- rooster silhouette, facing right -->
          <path d="M54 62 C52 30 40 8 26 3 C36 16 44 36 47 66Z"/>
          <path d="M50 64 C40 30 20 6 4 22 C14 16 30 26 44 70Z"/>
          <path d="M48 72 C34 46 14 34 2 50 C14 46 30 54 46 78Z"/>
          <path d="M47 80 C34 68 18 66 8 80 C20 78 32 82 48 86Z"/>
          <path d="M40 72 C40 54 60 50 74 55 C90 61 102 70 100 85 C98 99 84 107 66 107 C48 107 40 93 40 72Z"/>
          <path d="M68 64 C64 46 67 30 79 23 C91 18 99 28 97 39 C96 47 101 56 101 72 L80 74Z"/>
          <path d="M71 27 C67 17 75 13 79 19 C79 9 90 9 89 18 C92 11 102 15 97 25 C90 22 79 22 71 27Z"/>
          <path d="M96 30 L109 35 L96 40Z"/>
          <path d="M93 42 C99 46 98 57 91 57 C86 55 87 46 93 42Z"/>
          <path d="M62 104 L60 119 L51 123 L52 126 L61 123.5 L67 127 L68 124.5 L64 120 L67 104Z"/>
          <path d="M76 104 L76 119 L68 124 L70 126.5 L77 123 L84 126 L85 123.5 L80 120 L81 104Z"/>
        </g>
        <!-- sunglasses -->
        <path d="M70 29 L83 28" stroke="#0f0e0b" stroke-width="3" stroke-linecap="round"/>
        <path d="M82 27 H97 C98 33 96 38 90 38 C85 38 82 34 82 27Z" fill="#0f0e0b"/>
        <g clip-path="url(#lens-clip)">
          <path class="glint" d="M78 40 L86 24 L90 24 L82 40Z" fill="#f6f0e1" opacity=".75"/>
        </g>
      </svg>
      <span class="coop" aria-hidden="true">C<span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span>P</span>
    </h1>
    <p class="tagline"><span id="game-count"></span> games for Mac, still in the nest. Downloads open as each one hatches.</p>
  </header>

  <nav class="filters" aria-label="Filter games by genre">
    <div class="chips" id="chips">
      <span class="chip-marker" aria-hidden="true"></span>
    </div>
  </nav>

  <main class="grid" id="grid"></main>

  <footer class="footer">
    <span>Game Coop</span>
    <span>Directed by kids. Built with Claude. Made for macOS.</span>
  </footer>

  <dialog class="player" id="player" aria-labelledby="player-title">
    <div class="player-bar">
      <h2 class="player-title" id="player-title"></h2>
      <span class="player-hint">Click the game, then use your keyboard or a controller</span>
      <button type="button" class="player-btn" id="player-full">Full screen</button>
      <button type="button" class="player-btn" id="player-close">Close</button>
    </div>
    <iframe class="player-frame" id="player-frame" title="Game" allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>
  </dialog>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
